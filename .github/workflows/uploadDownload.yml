name: file exchange

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Create file
        run: echo "this is the first file I am storing" > file.txt

      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stored-file       # artifact label
          path: ./file.txt        # file to upload

  test:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: stored-file       # must match the upload name
          path: ./downloaded      # where to place it locally

      - name: Show file contents
        run: cat ./downloaded/file.txt
